<p-card styleClass="bg-c overflow-y-auto inner_content" [style]="{height: '82vh'}">
  <div class="flex flex-column justify-content-center align-items-center gap-4">
    <div class="flex gap-3 w-full">
      <p-avatar size="large"
                image="https://i.pinimg.com/564x/4a/eb/e4/4aebe421333230f3f39aaba8a6bb5022.jpg"
                shape="circle"/>
      <div class="flex flex-column gap-2">
        <div class="username">
          <span class="text-white">Anya Forger</span>
          <span class="text-400"> (anya_forger)</span>
        </div>
        <span class="text-sm text-400">Your personal account</span>
      </div>
    </div>
    <div class="flex flex-column gap-2 w-full">
      <div *ngFor="let item of settingsMenu; let i = index" class="flex align-items-center gap-4 menu-item w-full"
           (click)="toggleActive(i)"
           [ngClass]="{'active': isActive === i}">
        <i [class]="item.icon"></i>
        <span>{{ item.name }}</span>
      </div>
    </div>
  </div>
</p-card>
