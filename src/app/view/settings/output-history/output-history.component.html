<p-card styleClass="bg-white-alpha-80" [style]="{height: '82vh'}">
  <div class="flex flex-column gap-2 p-4 border-round bg-blue-50 overflow-y-scroll" [style]="{height: '76vh'}">
    <div class="col-12">
      <span class="text-2xl font-bold">產文歷史紀錄</span>
      <p-table [value]="output_history"
               [scrollable]="true"
               styleClass="mt-3">
        <ng-template pTemplate="body" let-output>
          <tr style="background: transparent">
            <td style="background: transparent">
              <div class="flex gap-3 p-2">
                <p-avatar icon="fa-regular fa-newspaper"
                          styleClass="mr-2"
                          size="large"
                          [style]="{'background-color':'#b8c1ec', 'color': '#232946'}"></p-avatar>
                <div class="flex flex-column gap-2">
                  <span
                    class="font-bold white-space-nowrap overflow-hidden text-overflow-ellipsis"
                    style="width:300px">{{ output.title }}</span>
                  <span class="text-sm">{{ output.created_at | date: 'yyyy-MM-dd' }}</span>
                </div>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</p-card>
