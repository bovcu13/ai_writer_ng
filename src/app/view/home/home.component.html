<p-toast></p-toast>
<div class="flex justify-content-center align-items-center h-full">
  <div [class]="colSize">
    <p-card styleClass="bg-white-alpha-80 overflow-y-scroll" [style]="{height: '82vh'}">
      <ng-template pTemplate="header">
        <div class="flex align-items-center p-3">
          <div class="mr-auto">
            <span class="text-xl font-bold">怪客口碑</span>
          </div>
          <div class="flex justify-content-end">
            <p-button icon="text-xs pi pi-chevron-right" [text]="true" severity="help"
                      (click)="changeColSize()" *ngIf="colSize === 'col-3'"
                      size="small"></p-button>
            <p-button icon="text-xs pi pi-chevron-left" [text]="true" severity="help"
                      (click)="changeColSize()" *ngIf="colSize === 'col-5'"
                      size="small"></p-button>
          </div>
        </div>
      </ng-template>
      <div class="grid">
        <form [formGroup]="description_form">
          <!--          無展開col-3-->
          <ng-container *ngIf="colSize === 'col-3'">
            <div class="col-12">
              <div class="field">
                <label class="text-sm font-medium">內容形式選擇</label>
                <br>
                <p-dropdown [options]="content"
                            formControlName="content"
                            placeholder="內容形式選擇"
                            styleClass="w-full border-round-3xl bg-blue-50"
                            appendTo="body"></p-dropdown>
              </div>
              <ng-container *ngIf="description_form.controls['content'].value === '論壇'">
                <div class="field">
                  <label class="text-sm font-medium">論壇選擇</label>
                  <br>
                  <p-dropdown [options]="forum"
                              formControlName="forum"
                              (onChange)="getTypes()"
                              placeholder="平台選擇"
                              styleClass="w-full border-round-3xl bg-blue-50"
                              appendTo="body"></p-dropdown>
                </div>
                <div class="field">
                  <label class="text-sm font-medium">字數限制</label>
                  <br>
                  <p-dropdown [options]="word_limit"
                              formControlName="word_limit"
                              placeholder="字數限制"
                              styleClass="w-full border-round-3xl bg-blue-50"
                              appendTo="body"></p-dropdown>
                </div>
                <div class="field">
                  <label class="text-sm font-medium">文章版位</label>
                  <br>
                  <p-dropdown [options]="board"
                              formControlName="board"
                              placeholder="文章版位"
                              styleClass="w-full border-round-3xl bg-blue-50"
                              appendTo="body"></p-dropdown>
                </div>
                <div class="field">
                  <label class="text-sm font-medium">文章類型</label>
                  <br>
                  <p-dropdown [options]="type"
                              formControlName="type"
                              placeholder="文章類型"
                              styleClass="w-full border-round-3xl bg-blue-50"
                              appendTo="body"></p-dropdown>
                </div>
                <div class="field">
                  <label class="text-sm font-medium">文章風格</label>
                  <br>
                  <p-dropdown [options]="style"
                              formControlName="style"
                              placeholder="文章風格"
                              styleClass="w-full border-round-3xl bg-blue-50"
                              appendTo="body"></p-dropdown>
                </div>
                <div class="field">
                  <label class="text-sm font-medium">業配程度</label>
                  <br>
                  <p-dropdown [options]="sponsorship"
                              formControlName="sponsorship"
                              placeholder="業配程度"
                              styleClass="w-full border-round-3xl bg-blue-50"
                              appendTo="body"></p-dropdown>
                </div>
              </ng-container>
              <!--通用-->
              <div class="field">
                <p-divider></p-divider>
                <label class="font-medium">人物設定</label>
              </div>
              <div class="field">
                <label class="text-sm font-medium">性別</label>
                <br>
                <p-dropdown [options]="gender"
                            formControlName="gender"
                            placeholder="性別"
                            styleClass="w-full border-round-3xl bg-blue-50"
                            appendTo="body"></p-dropdown>
              </div>
              <div class="field">
                <label class="text-sm font-medium">年齡</label>
                <br>
                <div class="flex align-items-center gap-3">
                  <p-inputNumber formControlName="from_age"
                                 [size]="5" suffix=" 歲" inputId="integeronly"></p-inputNumber>
                  <span>到</span>
                  <p-inputNumber formControlName="to_age"
                                 [size]="5" suffix=" 歲" inputId="integeronly"></p-inputNumber>
                </div>
              </div>
              <div class="field">
                <label class="text-sm font-medium">特性</label>
                <input formControlName="character_trait"

              </div>
              <div class="field">
                <label class="text-sm font-medium">其他細部描述</label>
                <textarea formControlName="character_remarks"

                </div>
              </div>
              <div class="field">

                <input formControlName="title"

              </div>
              <div class="field">

  <div class="col-5">
    <p-card styleClass="bg-white-alpha-80" [style]="{height: '82vh'}">
      <form [formGroup]="description_form">
        <div class="flex flex-column gap-3">
          <div class="flex flex-column gap-2 p-4 border-round bg-blue-50">
            <span class="text-2xl font-bold">怪客口碑</span>
            <textarea formControlName="article_output"
                      class="w-full text-sm border-none bg-blue-50" rows="15"
                      style="resize: none; overflow: auto;"
                      pInputTextarea>
          </textarea>
            <div class="flex justify-content-between">
              <p-button (click)="copyArticleOutput()" icon="text-xs pi pi-copy" [rounded]="true" [text]="true"
                        severity="help "
                        styleClass="w-1rem h-1rem"></p-button>
              <span
                class="text-xs text-400 text-right">字數：{{ countText(description_form.controls['article_output'].value) }}</span>
            </div>
          </div>
          <div class="flex align-items-start">
            <div class="flex flex-column gap-2">
              <p-fileUpload mode="basic" chooseLabel="相關圖上傳"
                            styleClass="text-sm bg-indigo-500 border-round-3xl"
                            name="demo[]" url="https://www.primefaces.org/cdn/api/upload.php"
                            accept="image/*"
                            chooseIcon="text-sm pi pi-plus"
                            [maxFileSize]="1000000"
                            [multiple]="true"
                            [showCancelButton]="true"
                            [showUploadButton]="true"></p-fileUpload>
            </div>
            <div class="ml-auto p-3 border-round bg-white-alpha-50">
              <span class="text-xs">為此回應評分</span>
              <div class="flex align-items-center gap-3 mt-2">
                <span class="text-sm font-medium">文章分數</span>
                <p-rating formControlName="rating" [cancel]="false"
                          iconOnClass="text-indigo-900 pi pi-star-fill"></p-rating>
              </div>
            </div>
          </div>
        </div>
      </form>
    </p-card>
  </div>
</div>

<p-dialog header="競品比較內容" [modal]="true" [(visible)]="comparative_dialog">
  <p-table [value]="pk" dataKey="id" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th style="width:20%"></th>
        <th style="width:20%">我方商品</th>
        <th style="width:20%">競品1</th>
        <th style="width:20%">競品2</th>
        <th style="width:20%">競品3</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product let-editing="editing">
      <tr>
        <td class="text-center font-semibold">{{ product.sw }}</td>
        <td [pEditableColumn]="product.me" pEditableColumnField="code">
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input pInputText type="text" [(ngModel)]="product.me"/>
            </ng-template>
            <ng-template pTemplate="output">
              {{ product.me }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td [pEditableColumn]="product.other1" pEditableColumnField="name">
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input pInputText type="text" [(ngModel)]="product.other1" required/>
            </ng-template>
            <ng-template pTemplate="output">
              {{ product.other1 }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td [pEditableColumn]="product.other2" pEditableColumnField="inventoryStatus">
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input pInputText [(ngModel)]="product.other2"/>
            </ng-template>
            <ng-template pTemplate="output">
              {{ product.other2 }}
            </ng-template>
          </p-cellEditor>
        </td>
        <td [pEditableColumn]="product.other3" pEditableColumnField="price">
          <p-cellEditor>
            <ng-template pTemplate="input">
              <input pInputText type="text" [(ngModel)]="product.other3"/>
            </ng-template>
            <ng-template pTemplate="output">
              {{ product.other3 }}
            </ng-template>
          </p-cellEditor>
        </td>
      </tr>
    </ng-template>
  </p-table>
  <div class="flex justify-content-end mt-5 gap-3">
    <p-button label="取消"
              (click)="comparative_dialog = false" [outlined]="true"
              size="small" styleClass="text-sm"
              severity="help"></p-button>
    <p-button label="確認"
              (click)="comparative_dialog = false" [raised]="true"
              size="small" styleClass="text-sm"
              severity="help"></p-button>
  </div>
</p-dialog>

<!--切角-->
<p-dialog header="切角示範文章" [(visible)]="demo_dialog" [modal]="true" [style]="{width: '70vw'}">
  <div class="flex justify-content-center">
    <div *ngFor="let story of story_output" class="col-4" style="position: relative" (click)="addOverlay(story)">
      <div class="flex flex-column gap-2 p-4 border-round bg-blue-50">
        <span class="text-lgl font-bold">切角示範 {{ story.id }}</span>
        <textarea [(ngModel)]="story.content"
                  class="w-full text-sm border-none bg-blue-50 select-input" rows="15"
                  style="resize: none; overflow: auto;"
                  pInputTextarea>
        </textarea>
        <span class="text-xs text-400 text-right">字數：{{ countText(story.content) }}</span>
      </div>
      <div *ngIf="activeOverlay === story.id"
           class="overlay border-round flex align-items-center justify-content-center">
        <i class="pi pi-check-circle" style="font-size: 5rem; z-index: 999; color: #18122B"></i>
      </div>
    </div>
  </div>
  <div class="flex justify-content-end mt-5 gap-3">
    <p-button label="取消"
              (click)="demo_dialog = false" [outlined]="true"
              size="small" styleClass="text-sm"
              severity="help"></p-button>
    <p-button label="確認"
              (click)="demo_dialog = false" [raised]="true"
              size="small" styleClass="text-sm"
              severity="help"></p-button>
  </div>
</p-dialog>
